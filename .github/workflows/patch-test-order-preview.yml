name: patch-test-order-preview

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-test-order-preview.mjs
      - .github/workflows/patch-test-order-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-test-order-preview.mjs
      - run: |
          git config user.name "artsilvia"
          git config user.email "artsilvia@gmail.com"
          git add src/server.mjs
          if git diff --cached --quiet; then
            echo "No patch changes were needed."
          else
            git commit -m "Make dry-run shipping checks no-render"
            git push origin HEAD:main
          fi
