name: fix-mockup-pricing

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-mockup-pricing.mjs
      - .github/workflows/fix-mockup-pricing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-mockup-pricing.mjs
      - run: |
          git config user.name "artsilvia"
          git config user.email "artsilvia@gmail.com"
          git add src/server.mjs src/product-creator.mjs
          if git diff --cached --quiet; then
            echo "No patch changes were needed."
          else
            git commit -m "Update curated USD pricing labels"
            git push origin HEAD:main
          fi
