name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/server.mjs
      - run: node --check src/product-creator.mjs
      - run: node --check src/mockup-sorter.mjs
      - run: node --check src/variants.mjs
      - run: npm test
