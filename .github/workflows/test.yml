name: test

# Automated runs are paused while GitHub Actions usage is exhausted.
# Use local Node tests. Manually reenable push/PR triggers after usage resets.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/server.mjs
      - run: node --check src/product-creator.mjs
      - run: node --check src/mockup-sorter.mjs
      - run: node --check src/variants.mjs
      - run: node --check src/printshrimp.mjs
      - run: node --check src/prodigi.mjs
      - run: node --check src/supplier-comparison.mjs
      - run: node --check src/supplier-comparison-page.mjs
      - run: node --check src/routing-proposal.mjs
      - run: npm test
