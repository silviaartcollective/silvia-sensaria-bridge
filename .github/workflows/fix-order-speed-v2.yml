name: fix-order-speed-v2

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-order-speed-v2.mjs
      - .github/workflows/fix-order-speed-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-order-speed-v2.mjs
      - run: node --check src/server.mjs
      - run: |
          git config user.name "artsilvia"
          git config user.email "artsilvia@gmail.com"
          git add src/server.mjs
          if git diff --cached --quiet; then
            echo "No patch changes were needed."
          else
            git commit -m "Fix canonical mockup order and speed Etsy uploads"
            git push origin HEAD:main
          fi
