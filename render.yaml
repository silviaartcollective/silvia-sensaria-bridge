services:
  - type: web
    name: silvia-sensaria-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ETSY_KEYSTRING
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: ETSY_REFRESH_TOKEN
        sync: false
      - key: ETSY_WEBHOOK_SECRET
        sync: false
      - key: ETSY_CALLBACK_URL
        value: https://silvia-sensaria-bridge.onrender.com/etsy/callback
      - key: SILVIA_ETSY_SHOP_ID
        sync: false
      - key: FULFILLMENT_MODE
        value: shadow
      - key: FULFILLMENT_LIVE_SUBMISSION_ENABLED
        value: "false"
      # Order Tracking sends tracking to Etsy (Mark shipped on Etsy, or automatic
      # completion from Gmail). "false" switches that off.
      - key: ETSY_SHIPMENT_SUBMISSION_ENABLED
        value: "true"
      - key: GELATO_FULFILLMENT_ENABLED
        value: "false"
      - key: PRODIGI_FULFILLMENT_ENABLED
        value: "false"
      - key: ARTELO_FULFILLMENT_ENABLED
        value: "false"
      # Receipts that may be sent to a supplier one at a time from Fulfillment
      # Review (comma-separated). Empty: none. See docs/supplier-submission-safety.md.
      - key: SUPPLIER_SUBMISSION_ALLOWED_RECEIPTS
        sync: false
      # Hourly: mark Etsy orders shipped with Artelo's tracking, for orders this
      # app sent to Artelo. See docs/supplier-submission-safety.md.
      - key: ARTELO_AUTO_TRACKING_ENABLED
        sync: false
      # Send new Artelo-recommended orders automatically (with both live
      # switches); only orders placed after it is switched on. Daily limit
      # ARTELO_AUTO_SUBMIT_DAILY_LIMIT (default 5).
      - key: ARTELO_AUTO_SUBMIT_ENABLED
        sync: false
      - key: ARTELO_AUTO_SUBMIT_DAILY_LIMIT
        sync: false
      - key: ARTELO_TEST_ORDER_ENABLED
        value: "false"
      - key: PRINTSHRIMP_FULFILLMENT_ENABLED
        value: "false"
      - key: PRINTIFY_FULFILLMENT_ENABLED
        value: "false"
      - key: PRINTIFY_API_TOKEN
        sync: false
      - key: PRINTIFY_API_URL
        sync: false
      - key: PRINTIFY_SHOP_ID
        sync: false
      - key: GELATO_API_KEY
        sync: false
      - key: GELATO_PRODUCT_API_URL
        value: https://product.gelatoapis.com/v3
      - key: GELATO_SHIPMENT_API_URL
        value: https://shipment.gelatoapis.com/v1
      - key: ARTELO_API_KEY
        sync: false
      - key: PRODIGI_API_KEY
        sync: false
      - key: PRINTSHRIMP_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: ADMIN_PASSWORD
        sync: false
      - key: CROP_WORKER_TOKEN
        sync: false
